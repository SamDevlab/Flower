<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#414B51" />
  <meta name="description" content="Flores para minha flor, Lorrane Bitencurt." />
  <title>Flores para minha flor 💜</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');

    :root {
      --forest: #414B51;
      --green: #5A6760;
      --storm: #777887;
      --grey: #9492A4;
      --axis: #BBB6C8;
      --purple: #E2D7F1;
      --paper: #F5F1F8;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--forest);
      color: var(--paper);
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    .page {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 78% 16%, rgba(226, 215, 241, .17), transparent 27%),
        radial-gradient(circle at 17% 82%, rgba(119, 120, 135, .28), transparent 34%),
        linear-gradient(160deg, #414B51 0%, #4c5758 52%, #5A6760 100%);
    }

    .page::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .frame {
      position: relative;
      z-index: 1;
      display: flex;
      width: min(100%, 430px);
      min-height: min(760px, calc(100svh - 36px));
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 30px 24px 26px;
      text-align: center;
    }

    .dedication {
      position: absolute;
      top: 8px;
      margin: 0;
      color: rgba(245, 241, 248, .62);
      font-size: .69rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .bouquet {
      position: relative;
      width: 250px;
      height: 285px;
      margin-top: 16px;
    }

    .stem {
      position: absolute;
      bottom: 40px;
      left: 50%;
      width: 3px;
      border-radius: 999px;
      background: linear-gradient(var(--green), #33423b);
      transform-origin: bottom center;
    }

    .stem::after {
      content: '';
      position: absolute;
      top: 53%;
      left: 50%;
      width: 29px;
      height: 13px;
      border-radius: 85% 15% 85% 15%;
      background: var(--green);
      transform-origin: left center;
    }

    .s1 { height: 160px; transform: rotate(-25deg); }
    .s2 { height: 205px; transform: rotate(-12deg); }
    .s3 { height: 220px; transform: rotate(0deg); }
    .s4 { height: 198px; transform: rotate(13deg); }
    .s5 { height: 164px; transform: rotate(25deg); }

    .s1::after, .s3::after, .s5::after { transform: rotate(-28deg); }
    .s2::after, .s4::after { transform: rotate(150deg); }

    .flower {
      position: absolute;
      top: -24px;
      left: 50%;
      width: 54px;
      height: 54px;
      transform: translateX(-50%) rotate(8deg);
      filter: drop-shadow(0 10px 16px rgba(19, 24, 26, .15));
    }

    .flower i {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 23px;
      height: 33px;
      border-radius: 55% 55% 48% 48%;
      background: var(--purple);
      transform-origin: 50% 100%;
    }

    .flower i:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
    .flower i:nth-child(2) { transform: translate(-50%, -100%) rotate(72deg); background: var(--axis); }
    .flower i:nth-child(3) { transform: translate(-50%, -100%) rotate(144deg); background: var(--grey); }
    .flower i:nth-child(4) { transform: translate(-50%, -100%) rotate(216deg); background: var(--storm); }
    .flower i:nth-child(5) { transform: translate(-50%, -100%) rotate(288deg); background: #d4c8e7; }

    .flower b {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--forest);
      transform: translate(-50%, -50%);
    }

    .s2 .flower, .s4 .flower { transform: translateX(-50%) rotate(-8deg) scale(.92); }
    .s1 .flower, .s5 .flower { transform: translateX(-50%) rotate(12deg) scale(.86); }

    .ribbon {
      position: absolute;
      bottom: 34px;
      left: 50%;
      width: 78px;
      height: 24px;
      border-radius: 999px;
      background: var(--axis);
      transform: translateX(-50%) rotate(2deg);
      box-shadow: 0 10px 20px rgba(19, 24, 26, .12);
    }

    .ribbon::before,
    .ribbon::after {
      content: '';
      position: absolute;
      top: 14px;
      width: 34px;
      height: 62px;
      background: linear-gradient(var(--axis), rgba(148, 146, 164, .32));
      clip-path: polygon(0 0, 100% 7%, 72% 100%, 16% 84%);
    }

    .ribbon::before { left: 12px; transform: rotate(10deg); }
    .ribbon::after { right: 5px; transform: rotate(-16deg); }

    .eyebrow {
      margin: 0 0 12px;
      color: rgba(245, 241, 248, .5);
      font-size: .66rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(3.1rem, 14vw, 4.65rem);
      font-weight: 500;
      line-height: .92;
      letter-spacing: -.055em;
    }

    h1 em {
      display: block;
      margin-top: 5px;
      color: var(--purple);
      font-weight: 500;
    }

    .made-with {
      margin: 2px 0 0;
      color: rgba(245, 241, 248, .48);
      font-family: 'Playfair Display', Georgia, serif;
      font-size: .9rem;
      font-style: italic;
      line-height: 1.5;
    }

    .pixel {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 1px;
      background: var(--purple);
      opacity: .28;
    }

    .p1 { top: 22%; left: 9%; }
    .p2 { top: 31%; right: 11%; width: 3px; height: 3px; }
    .p3 { bottom: 18%; left: 14%; width: 3px; height: 3px; }
    .p4 { bottom: 27%; right: 8%; }

    @media (max-height: 690px) {
      .frame { gap: 12px; padding-block: 22px 16px; }
      .bouquet { width: 210px; height: 225px; transform: scale(.84); margin-block: -8px -18px; }
      h1 { font-size: clamp(2.8rem, 12vw, 3.7rem); }
    }

    @media (min-width: 700px) {
      .frame {
        min-height: 760px;
        border: 1px solid rgba(226, 215, 241, .08);
        border-radius: 32px;
        background: rgba(65, 75, 81, .16);
        box-shadow: 0 30px 90px rgba(24, 30, 32, .14);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <span class="pixel p1" aria-hidden="true"></span>
    <span class="pixel p2" aria-hidden="true"></span>
    <span class="pixel p3" aria-hidden="true"></span>
    <span class="pixel p4" aria-hidden="true"></span>

    <section class="frame" aria-labelledby="title">
      <p class="dedication">para Lorrane Bitencurt</p>

      <div class="bouquet" aria-hidden="true">
        <span class="stem s1"><span class="flower"><i></i><i></i><i></i><i></i><i></i><b></b></span></span>
        <span class="stem s2"><span class="flower"><i></i><i></i><i></i><i></i><i></i><b></b></span></span>
        <span class="stem s3"><span class="flower"><i></i><i></i><i></i><i></i><i></i><b></b></span></span>
        <span class="stem s4"><span class="flower"><i></i><i></i><i></i><i></i><i></i><b></b></span></span>
        <span class="stem s5"><span class="flower"><i></i><i></i><i></i><i></i><i></i><b></b></span></span>
        <span class="ribbon"></span>
      </div>

      <div class="copy">
        <p class="eyebrow">um pequeno jardim digital</p>
        <h1 id="title">Flores para <em>minha flor.</em></h1>
      </div>

      <p class="made-with">feito com carinho<br />e alguns pixels</p>
    </section>
  </main>
</body>
</html>
